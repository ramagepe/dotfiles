# Aura theme - minimal tmux config

# No status bar
set -g status off

# No pane border titles
set -g pane-border-status off

# Pane border colors (only visible line between panes)
# Dynamic color set per-pane via shell hook in .bashrc
set -g pane-border-style "fg=#282A36"
set -g pane-active-border-style "fg=#F8F8F2"

# Message style
set -g message-style "bg=#CBC3E3,fg=#282A36"
set -g message-command-style "bg=#CBC3E3,fg=#282A36"

# Vim-style pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Zoom toggle: prefix + b (instead of prefix + z)
unbind z
bind b resize-pane -Z

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
