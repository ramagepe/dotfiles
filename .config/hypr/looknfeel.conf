# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
    # gaps_in = 0
    # gaps_out = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8
}

# Ocultar barra de tabs de grupos y usar mismos colores de borde
group {
    col.border_active = 0xeef8f8f2 0xee8be9fd 45deg
    col.border_inactive = 0x88282a36
    # Hyprland 0.55 ya no acepta -1 (ver default omarchy); fijamos colores reales.
    col.border_locked_active = 0xeef8f8f2 0xee8be9fd 45deg
    col.border_locked_inactive = 0x88282a36
    groupbar {
        height = 0
        render_titles = false
    }
}

# Auto-agrupar terminales Ghostty
windowrule = group set, match:class com.mitchellh.ghostty

# No resetear el cursor al centro al cambiar de workspace
cursor {
    warp_on_change_workspace = false
}

