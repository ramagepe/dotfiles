# Extra autostart processes

# Desactivar fcitx5 (el default de Omarchy intenta arrancarlo)
exec-once = sleep 1 && pkill -9 fcitx5 2>/dev/null

# === WORKSPACE ASSIGNMENTS (window rules) ===
# Asignan ventanas a workspaces basándose en su clase (Hyprland 0.53+ syntax)
windowrule = workspace 2 silent, match:class zen
windowrule = workspace 3 silent, match:class Postman
windowrule = workspace 3 silent, match:class postman
windowrule = workspace 4 silent, match:class obsidian
windowrule = workspace 5 silent, match:class discord
windowrule = workspace 5 silent, match:class Discord
windowrule = workspace 7 silent, match:class Bitwarden
windowrule = workspace 8 silent, match:class org.gnome.Nautilus
windowrule = workspace 10 silent, match:class spotify
windowrule = workspace 10 silent, match:class Spotify
windowrule = workspace 10 silent, match:class Cider

# === AUTOSTART APPS ===
# Las apps que arrancan solas dependen de la maquina: viven en local.conf
# (alternates de yadm: local.conf##class.desktop / local.conf##class.laptop)
